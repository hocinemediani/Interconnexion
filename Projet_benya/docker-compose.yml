services:
  # --- Routeurs ---
  router:
    image: alpine:latest
    container_name: mon-routeur
    # Active le "IP Forwarding" au niveau du kernel pour permettre le routage
    sysctls:
      - net.ipv4.ip_forward=1
    cap_add:
      - NET_ADMIN
    networks:
      net_a:
        ipv4_address: 192.168.10.254
      net_b:
        ipv4_address: 192.168.20.254
    command: sh -c "apk add --no-cache iptables tcpdump && tail -f /dev/null"

  # --- DHCP ---
  dhcpa:
    image: alpine:latest
    container_name: dhcpa
    cap_add:
      - NET_ADMIN
    networks:
          net_a:
            ipv4_address: 192.168.10.5
    volumes:
          - ./services/dhcp/dhcpa.conf:/etc/dnsmasq.conf
    command: sh -c "apk add --no-cache dnsmasq && dnsmasq -d"

  dhcpb:
    image: alpine:latest
    container_name: dhcpb
    cap_add:
      - NET_ADMIN
    networks:
          net_b:
            ipv4_address: 192.168.20.5
    volumes:
          - ./services/dhcp/dhcpb.conf:/etc/dnsmasq.conf
    command: sh -c "apk add --no-cache dnsmasq && dnsmasq -d"

  # --- Zone A ---
  clienta1:
    image: alpine:latest
    container_name: client-a1
    cap_add:
      - NET_ADMIN
    networks:
      net_a: {}
    command: >
          sh -c "ip addr flush dev eth0 && 
                udhcpc -i eth0 -b && 
                tail -f /dev/null"

  clienta2:
    image: alpine:latest
    container_name: client-a2
    cap_add:
      - NET_ADMIN
    networks:
      net_a: {}
    command: >
          sh -c "ip addr flush dev eth0 && 
                udhcpc -i eth0 -b && 
                tail -f /dev/null"

  # --- Zone B ---
  clientb1:
    image: alpine:latest
    container_name: client-b1
    cap_add:
      - NET_ADMIN
    networks:
      net_b: {}
    command: >
          sh -c "ip addr flush dev eth0 && 
                udhcpc -i eth0 -b && 
                tail -f /dev/null"

# --- Définition des réseaux ---
networks:
  net_a:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  net_b:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24