! -*- mode: conf -*-
! ================================================================
! Configuration FRRouting pour Router AS-1
! Rôle: Routeur d'interconnexion AS principal
! ================================================================

! SECTION 1: Configuration globale

frr version 8.5
frr defaults traditional
hostname router-as-1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!


! SECTION 2: Configuration de l'interface


! Interface vers le réseau AS principal (120.0.32.0/20)
interface eth0
  description Connexion vers reseau-as principal
  no shutdown
!

! SECTION 3: Configuration OSPF (routage dynamique interne)


router ospf
  ospf router-id 120.0.32.7
  ! Annonce le réseau AS principal en OSPF
  network 120.0.32.0/20 area 0
  ! Redistribue les routes directement connectées
  redistribute connected
  ! Configuration des interfaces passives
  passive-interface default
  no passive-interface eth0
!

! ================================================================
! SECTION 4: Configuration BGP (interconnexion entre AS)
! ================================================================
! À configurer une fois les autres AS en place (si on travaille avec bgp)
! ça restera commenté en attendant ...
!
! router bgp 65001
!   bgp router-id 120.0.32.7
!   neighbor 120.0.?.? remote-as 65002
!   network 120.0.32.0/20
! !


! SECTION 5: Routes statiques


! Route vers le réseau entreprise AS1 (via routeur entreprise AS1)
ip route 192.168.10.0/24 120.0.32.5
!

! Route par défaut vers router-1 (pour Internet)
ip route 0.0.0.0/0 120.0.32.1
!


! SECTION 6: Configuration de l'accès console (vtysh)


line vty
  exec-timeout 0 0
!

end
