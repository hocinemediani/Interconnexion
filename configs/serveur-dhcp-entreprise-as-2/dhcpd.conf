ddns-update-style standard;
ddns-updates on;
do-forward-updates on;

key "ddns-key" {
    algorithm hmac-sha256;
    secret "79KSvIQC495DW98+8ANRV3pjEK13U1BQpw94re5izZQ=";
}

zone entreprise.com. {
    primary 192.168.20.8;
    key ddns-key;
}

subnet 192.168.20.0 netmask 255.255.255.0 {
    range 192.168.20.10 192.168.20.60;
    option routers 192.168.20.1;
    option domain-name-servers 192.168.20.8;
    option domain-name "entreprise.com";
    ddns-hostname = option host-name;
}
