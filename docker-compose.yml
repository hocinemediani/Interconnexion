services:
  router-1:
    image: frrouting/frr:latest
    container_name: router-1
    privileged: true
    networks: 
      reseau-as:
        ipv4_address: 120.0.32.1

  router-services:
    image: frrouting/frr:latest
    container_name: router-services
    privileged: true
    networks:
      reseau-as:
        ipv4_address: 120.0.32.2
      reseau-services:
        ipv4_address: 120.0.33.1

  router-server-web-public:
    image: alpine:latest
    container_name: router-server-web-public
    privileged: true
    networks:
      reseau-services:
        ipv4_address: 120.0.33.5
      reseau-serveur-web-public:
        ipv4_address: 120.0.33.29
  
  router-server-web-entreprise:
    image: alpine:latest
    container_name: router-server-web-entreprise
    privileged: true
    networks:
      reseau-services:
        ipv4_address: 120.0.33.4
      reseau-serveur-web-entreprise:
        ipv4_address: 120.0.33.25

  server-dns:
    image: ubuntu/bind9:latest
    container_name: server-dns
    networks:
      reseau-serveur-dns: 
        ipv4_address: 120.0.33.22
    volumes:
      - ./configs/server-dns:/etc/bind
    ports:
      - "53:53/udp"
      - "53:53/tcp"

  server-web-public:
    image: nginx:latest
    container_name: serveur-web-public
    networks:
      reseau-serveur-web-public:
        ipv4_address: 120.0.33.30
    ports:
      - "8080:80"
    volumes:
      - ./configs/server-web-public/html:/usr/share/nginx/html:ro
      - ./configs/server-web-public/config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
      
  server-web-entreprise:
    image: nginx:latest
    container_name: server-web-entreprise
    networks:
      reseau-serveur-web-entreprise:
        ipv4_address: 120.0.33.26
    ports:
      - "80:80"
    volumes:
      - ./configs/server-web-entreprise/html:/usr/share/nginx/html:ro
      - ./configs/server-web-entreprise/config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  reseau-as:
    driver: bridge
    ipam:
      config:
        - subnet: 120.0.32.0/24
  reseau-services:
    driver: bridge
    ipam:
      config:
        - subnet: 120.0.33.0/28
          gateway: 120.0.33.14
  reseau-serveur-web-entreprise:
    driver: bridge
    ipam:
      config:
        - subnet: 120.0.33.24/30
          gateway: 120.0.33.25
  reseau-serveur-web-public:
    driver: bridge
    ipam:
      config:
        - subnet: 120.0.33.28/30
          gateway: 120.0.33.29
  reseau-serveur-dns:
    driver: bridge
    ipam:
      config:
        - subnet: 120.0.33.20/30
          gateway: 120.0.33.21
  reseau-serveur-smtp:
    driver: bridge
    ipam:
      config:
        - subnet: 120.0.33.16/30
          gateway: 120.0.33.17
  reseau-client-as-5:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.40.0/24
          gateway: 192.168.40.254
  reseau-client-as-2:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.30.0/24
          gateway: 192.168.30.254
  reseau-entreprise-as-2:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24
          gateway: 192.168.20.254
  reseau-entreprise-as-1:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.254
