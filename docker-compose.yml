services:
  serveur-dns:
    image: ubuntu/bind9:latest
    container_name: serveur-dns
    privileged: true
    networks:
      reseau-services:
        ipv4_address: 120.0.17.3
    volumes:
      - ./configs/serveur-dns/named.conf.options:/etc/bind/named.conf.options
      - ./configs/serveur-dns/named.conf.local:/etc/bind/named.conf.local
      - ./configs/serveur-dns/db.as2.com:/etc/bind/db.as2.com
      - ./configs/serveur-dns/db.sitepublic.com:/etc/bind/db.sitepublic.com
      - ./configs/serveur-dns/init.sh:/usr/local/bin/init.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init.sh"]

  serveur-dns-entreprise:
    image: ubuntu/bind9:latest
    container_name: serveur-dns-entreprise
    privileged: true
    dns:
      - 120.0.17.3
    networks:
      reseau-entreprise-as-2:
        ipv4_address: 192.168.20.4
    volumes:
      - ./configs/serveur-dns-entreprise/named.conf.options:/etc/bind/named.conf.options
      - ./configs/serveur-dns-entreprise/named.conf.local:/etc/bind/named.conf.local
      - ./configs/serveur-dns-entreprise/db.entreprise.com:/etc/bind/db.entreprise.com
      - ./configs/serveur-dns-entreprise/init.sh:/usr/local/bin/init.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init.sh"]

  routeur-1:
    image: frrouting/frr:latest
    container_name: routeur-1
    privileged: true
    dns:
      - 120.0.17.3
    networks:
      reseau-as:
        ipv4_address: 120.0.16.1
    volumes:
      - ./configs/routeur-1/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]
  
  routeur-entreprise-as-2:
    image: frrouting/frr:latest
    container_name: routeur-entreprise-as-2
    privileged: true
    dns:
      - 120.0.17.3
    networks:
      reseau-as:
        ipv4_address: 120.0.16.3
      reseau-entreprise-as-2:
        ipv4_address: 192.168.20.1
    volumes:
      - ./configs/routeur-entreprise-as-2/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]

  routeur-client-as-2:
    image: frrouting/frr:latest
    container_name: routeur-client-as-2
    privileged: true
    dns:
      - 120.0.17.3
    networks:
      reseau-as:
        ipv4_address: 120.0.16.4
        mac_address: "02:42:ac:11:00:01"  
        interface_name: eth0
      reseau-client-as-2:
        ipv4_address: 192.168.30.1
        interface_name: eth1
    volumes:
      - ./configs/routeur-client-as-2/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]

  routeur-entreprise-as-1:
    image: frrouting/frr:latest
    container_name: routeur-entreprise-as-1
    privileged: true
    dns:
      - 120.0.17.3
    networks:
      reseau-as:
        ipv4_address: 120.0.16.5
      reseau-entreprise-as-1:
        ipv4_address: 192.168.10.1
    volumes:
      - ./configs/routeur-entreprise-as-1/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]

  routeur-client-as-5:
    image: frrouting/frr:latest
    container_name: routeur-client-as-5
    privileged: true
    dns:
      - 120.0.17.3
    networks:
      reseau-as:
        ipv4_address: 120.0.16.6
        mac_address: "02:42:ac:11:00:02"
        interface_name: eth0
      reseau-client-as-5:
        ipv4_address: 192.168.40.1
        interface_name: eth1
    volumes:
      - ./configs/routeur-client-as-5/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]

  routeur-as-1:
    image: frrouting/frr:latest
    container_name: routeur-as-1
    privileged: true
    dns:
      - 120.0.17.3
    networks:
      reseau-as:
        ipv4_address: 120.0.16.7
    volumes:
      - ./configs/routeur-as-1/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]
          

  routeur-as-3:
    image: frrouting/frr:latest
    container_name: routeur-as-3
    privileged: true
    dns:
      - 120.0.17.3
    networks:
      reseau-as:
        ipv4_address: 120.0.16.8
    volumes:
      - ./configs/routeur-as-3/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]

  routeur-as-4:
    image: frrouting/frr:latest
    container_name: routeur-as-4
    privileged: true
    dns:
      - 120.0.17.3
    networks:
      reseau-as:
        ipv4_address: 120.0.16.9
    volumes:
      - ./configs/routeur-as-4/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]

  routeur-as-5:
    image: frrouting/frr:latest
    container_name: routeur-as-5
    privileged: true
    dns:
      - 120.0.17.3
    networks:
      reseau-as:
        ipv4_address: 120.0.16.10
    volumes:
      - ./configs/routeur-as-5/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]
  
  routeur-services:
    image: frrouting/frr:latest
    container_name: routeur-services
    privileged: true
    dns:
      - 120.0.17.3
    networks:
      reseau-as:
        ipv4_address: 120.0.16.2
      reseau-services:
        ipv4_address: 120.0.17.1
    volumes:
      - ./configs/routeur-services/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]

  serveur-web-public:
    build:
      context: ./configs/serveur-web-public/
      dockerfile: Dockerfile
    container_name: serveur-web-public
    privileged: true
    ports:
      - 80:80
    dns:
      - 120.0.17.3
    networks:
      reseau-services:
        ipv4_address: 120.0.17.2
    volumes:
      - ./configs/serveur-web-public/html:/usr/share/nginx/html:ro
      - ./configs/serveur-web-public/init.sh:/usr/local/bin/init.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init.sh"]

  serveur-web-entreprise:
    build:
      context: ./configs/serveur-web-entreprise/
      dockerfile: Dockerfile
    container_name: serveur-web-entreprise
    privileged: true
    ports:
      - 8080:80
    dns:
      - 192.168.20.4
    networks:
      reseau-entreprise-as-2:
        ipv4_address: 192.168.20.2
    volumes:
      - ./configs/serveur-web-entreprise/html:/usr/share/nginx/html:ro
      - ./configs/serveur-web-entreprise/init.sh:/usr/local/bin/init.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init.sh"]

  serveur-mail:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: serveur-mail
    hostname: mail
    domainname: entreprise.local
    ports:
      - "25:25"    # Port SMTP (Envoi)
      - "143:143"  # Port IMAP (Réception)
    networks:
      reseau-entreprise-as-2:
        ipv4_address: 192.168.20.3
    volumes:
      - ./configs/serveur-mail/maildata:/var/mail
      - ./configs/serveur-mail/mailstate:/var/mail-state
      - ./configs/serveur-mail/config:/tmp/docker-mailserver
    environment:
      - ENABLE_AMAVIS=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ENABLE_DKIM=0
      - TLS_LEVEL=intermediate
      - ONE_DIR=1

  equipement-client-as-2:
    image: nicolaka/netshoot
    container_name: equipement-client-as-2
    dns:
      - 192.168.20.4
    networks:
      reseau-client-as-2:
        ipv4_address: 192.168.30.2
        interface_name: eth0
    cap_add:
      - NET_ADMIN
    volumes:
      - ./configs/equipement-client-as-2/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]

  equipement-entreprise-as-2:
    image: nicolaka/netshoot
    container_name: equipement-entreprise-as-2
    dns:
      - 192.168.20.4
    privileged: true
    networks:
      reseau-entreprise-as-2:
        ipv4_address: 192.168.20.5
    cap_add:
      - NET_ADMIN
    volumes:
      - ./configs/equipement-entreprise-as-2/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]

  equipement-entreprise-as-2.2:
    image: nicolaka/netshoot
    container_name: equipement-entreprise-as-2.2
    dns:
      - 192.168.20.4
    privileged: true
    networks:
      reseau-entreprise-as-2:
        ipv4_address: 192.168.20.7
    cap_add:
      - NET_ADMIN
    volumes:
      - ./configs/equipement-entreprise-as-2.2/init.sh:/usr/local/bin/init_custom.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init_custom.sh"]
  
  serveur-dhcp-client-as-2:
    image: networkboot/dhcpd:latest
    container_name: serveur-dhcp-client-as-2
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      reseau-client-as-2:
        ipv4_address: 192.168.30.3
    volumes:
      - ./configs/serveur-dhcp-client-as-2/dhcpd.conf:/data/dhcpd.conf
  
  serveur-dhcp-entreprise-as-2:
    image: networkboot/dhcpd:latest
    container_name: serveur-dhcp-entreprise-as-2
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      reseau-entreprise-as-2:
        ipv4_address: 192.168.20.6
    volumes:
      - ./configs/serveur-dhcp-entreprise-as-2/dhcpd.conf:/data/dhcpd.conf

  serveur-dhcp-as:
    image: networkboot/dhcpd:latest
    container_name: serveur-dhcp-as
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      reseau-as:
        ipv4_address: 120.0.16.11
    volumes:
      - ./configs/serveur-dhcp-as/dhcpd.conf:/data/dhcpd.conf

networks:
  reseau-as:
    driver: bridge
    ipam:
      config:
        - subnet: 120.0.16.0/24
          gateway: 120.0.16.254
  reseau-services:
    driver: bridge
    ipam:
      config:
        - subnet: 120.0.17.0/28
          gateway: 120.0.17.14
  reseau-client-as-5:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.40.0/24
          gateway: 192.168.40.254
  reseau-client-as-2:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.30.0/24
          gateway: 192.168.30.254
  reseau-entreprise-as-2:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24
          gateway: 192.168.20.254
  reseau-entreprise-as-1:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.254
